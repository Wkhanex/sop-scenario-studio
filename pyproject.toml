[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sop-scenario-studio"
version = "0.1.0"
description = "Build local SOP scenarios and test action traces against role, evidence and timing gates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Waleed Khan"}]
dependencies = []

[project.scripts]
sop-studio = "sop_studio.cli:main"

[tool.setuptools.packages.find]
include = ["sop_studio*"]
